[build]
  # public/ is produced by the command. It is the website only.
  # Functions stay in netlify/functions and are not part of that folder.
  command = "node scripts/assemble-site.js"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["data/menus.json"]

[[headers]]
  for = "/portal.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/thanks.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The function directory and old duplicate copies used to be downloadable
# because the whole repository was the publish folder. force applies even if
# a dashboard setting publishes the repository root instead of public/.
# /.netlify/functions/* is the function router and is not matched here.

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/functions/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/lib/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/test/*"
  to = "/404.html"
  status = 404
  force = true

# Exact file names only. A star is valid in Netlify only at the end of a
# path, so it cannot mean "root JavaScript files" without also risking
# /assets/app.js. Those asset files must keep loading.

